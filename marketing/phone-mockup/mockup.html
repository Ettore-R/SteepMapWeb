<!doctype html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:525px;height:949px;background:transparent;overflow:hidden}
.stage{position:relative;width:525px;height:949px}
.phone{position:absolute;left:60px;top:50px;width:405px;height:849px;border-radius:58px;
 background:linear-gradient(145deg,#8d9199 0%,#3b3e44 18%,#1b1c20 50%,#4a4d54 82%,#9aa0a8 100%);
 padding:3px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.body{width:100%;height:100%;border-radius:55px;background:#050505;padding:9px;position:relative;
 box-shadow:inset 0 0 0 1.5px #23252a, inset 0 0 6px 1px rgba(255,255,255,.08)}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.glass{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 28%,rgba(255,255,255,0) 45%)}
.cam{position:absolute;top:14px;left:50%;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#2a3550 0,#0a0d16 45%,#000 70%);box-shadow:0 0 0 2px #000}
.btn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2a2c31,#74787f 60%,#4a4d54)}
.pw{right:-1.5px;top:200px;height:82px}
.v1{left:-1.5px;top:170px;height:52px;background:linear-gradient(270deg,#2a2c31,#74787f 60%,#4a4d54)}
.v2{left:-1.5px;top:238px;height:52px;background:linear-gradient(270deg,#2a2c31,#74787f 60%,#4a4d54)}
</style>
<div class="stage"><div class="phone">
<div class="btn pw"></div><div class="btn v1"></div><div class="btn v2"></div>
<div class="body"><div class="screen"><img src="screenshot.png"><div class="glass"></div><div class="cam"></div></div></div>
</div></div>
